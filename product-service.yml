server:
  port: 8181

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-ecommerce-auth-service-123456}
  expiration: 3600000

logging:
  level:
    root: INFO
    com.ecommerce.product: INFO
  file:
    name: logs/product-service.log